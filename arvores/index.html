<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Árvores Binárias - Matrix Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="painel-controles">
        <a href="../index.html" class="btn-voltar">< Voltar ao Hub</a>
        
        <div class="controle-grupo">
            <label for="input-valor">Valor:</label>
            <input type="number" id="input-valor" value="50">
        </div>
        
        <div class="botoes">
            <button id="btn-inserir">Inserir</button>
            <button id="btn-buscar">Buscar</button>
        </div>
        
        <div class="botoes">
            <button id="btn-inorder">In-Order</button>
            <button id="btn-preorder">Pre-Order</button>
            <button id="btn-postorder">Post-Order</button>
        </div>
        
        <!-- Onde o resultado da leitura vai aparecer -->
        <div style="width: 100%; margin-top: 15px; color: #00ff41; font-weight: bold;">
            > Leitura: [ <span id="resultado-travessia"></span> ]
        </div>
    </div>

    <canvas id="tela" width="800" height="500"></canvas>

    <script src="script.js"></script>
</body>
</html>
