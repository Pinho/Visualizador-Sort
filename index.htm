<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Algoritmos</title>
</head>
<body>
    <!-- Carrega as ferramentas de som primeiro -->
    <script src="audio.js"></script>
    


    <div>
    <label for="slider-quantidade">Quantidade de Barras:</label>
    <!-- min e max definem os limites, e value é onde a bolinha começa -->
    <input type="range" id="slider-quantidade" min="5" max="150" value="30">
</div>
<div>
    <label for="slider-velocidade">Tempo de Espera (ms):</label>
    <input type="range" id="slider-velocidade" min="1" max="300" value="50">
</div>
<div>
    <label for = "seletor-algoritmo">Algoritmo:</label>
    <select id="seletor-algoritmo">
        <option value="bubble">Bubble Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="insertion">Insertion Sort</option>  
        <option value="quick">Quick Sort</option> 
        <!-- <option value="merge">Merge Sort</option>  -->  
        </select>
</div>
<div>
    <button id="btn-gerar">Gerar Novo Array</button>
    <button id="btn-ordenar">Ordenar</button> 
</div>

    <canvas id="tela" width="800" height="400"></canvas>

    
    <script src="script.js"></script>
</body>
</html>
